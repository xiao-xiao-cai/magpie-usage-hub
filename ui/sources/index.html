<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="usage-admin-token" content="__USAGE_ADMIN_TOKEN__">
  <title>来源管理 · Magpie Usage Hub</title>
  <link rel="stylesheet" href="../dashboard/dashboard.css">
  <link rel="stylesheet" href="sources.css">
  <script defer src="sources.js"></script>
</head>
<body>
  <main>
    <header>
      <div>
        <a href="../dashboard/">用量看板</a>
        <h1>来源管理</h1>
      </div>
      <button id="refresh-sources" type="button">刷新</button>
    </header>
    <p id="sources-notice" class="notice" role="status">正在读取来源…</p>

    <section id="sources-section" aria-labelledby="sources-heading">
      <h2 id="sources-heading">已登记来源</h2>
      <p id="sources-empty" class="muted" hidden>尚无来源。</p>
      <div id="sources-table" class="table-scroll" role="region" tabindex="0" aria-label="来源列表" hidden>
        <table>
          <thead>
            <tr><th scope="col">来源</th><th scope="col">状态</th><th scope="col">最近活动</th><th scope="col">上报凭据</th><th scope="col">操作</th></tr>
          </thead>
          <tbody id="sources-rows"></tbody>
        </table>
      </div>
    </section>

    <section id="editor" aria-labelledby="source-title">
      <h2 id="source-title" tabindex="-1">添加 OTLP 来源</h2>
      <p id="source-identity" class="muted" hidden>来源 ID <code id="source-id"></code></p>
      <p id="local-source-hint" class="muted" hidden>中心本机网关在插件设置中配置。</p>
      <p id="historical-source-hint" class="muted" hidden>此来源的历史明细可在用量看板查询。</p>
      <form id="source-form" novalidate>
        <fieldset id="source-fields" class="source-fields" disabled>
          <div class="source-field">
            <label for="source-name">来源名称</label>
            <input id="source-name" type="text" autocomplete="off" required>
          </div>
          <div id="create-credential" class="source-field">
            <label for="source-digest">上报令牌的 SHA-256 摘要</label>
            <input id="source-digest" type="text" maxlength="64" autocomplete="off" spellcheck="false" aria-describedby="source-digest-hint">
            <small id="source-digest-hint" class="muted">填入 Magpie OTLP 上报令牌对应的 64 位十六进制摘要。</small>
          </div>
          <label class="source-check" for="source-enabled">
            <input id="source-enabled" type="checkbox" checked>
            允许来源上报
          </label>
          <div class="source-actions controls">
            <button id="save-source" type="submit" disabled>保存来源</button>
          </div>
        </fieldset>
      </form>
      <div id="source-credentials" class="source-tools" hidden>
        <h3>上报凭据</h3>
        <p id="credential-status" class="muted"></p>
        <form id="rotation-form" class="controls" novalidate>
          <div class="source-field">
            <label for="rotation-digest">新令牌的 SHA-256 摘要</label>
            <input id="rotation-digest" type="text" maxlength="64" autocomplete="off" spellcheck="false">
          </div>
          <button id="rotate-source" type="submit">登记新令牌</button>
        </form>
        <div class="controls source-actions">
          <button id="revoke-current" type="button" hidden>撤销当前令牌</button>
          <button id="revoke-pending" type="button" hidden>撤销待用令牌</button>
          <button id="revoke-all" type="button" hidden>撤销全部令牌</button>
        </div>
      </div>
      <div id="recovery-tools" class="controls source-tools" hidden>
        <button id="rebuild-source" type="button">确认同源重建</button>
      </div>
      <div id="action-confirmation" class="source-tools confirmation" role="group" aria-labelledby="confirmation-text" hidden>
        <p id="confirmation-text"></p>
        <div class="controls">
          <button id="confirm-action" type="button">确认</button>
          <button id="cancel-action" type="button">取消</button>
        </div>
      </div>
      <div class="controls source-tools"><button id="reset-source" type="button" hidden>返回添加 OTLP 来源</button></div>
      <p id="source-notice" class="notice" role="status"></p>
      <div id="revision-review" hidden>
        <p id="latest-source" class="muted"></p>
        <button id="review-latest" type="button">载入最新修订并保留草稿</button>
      </div>
    </section>
  </main>
</body>
</html>
