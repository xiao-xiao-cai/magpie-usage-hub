<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="usage-admin-token" content="__USAGE_ADMIN_TOKEN__">
  <title>来源管理 · Magpie Usage Hub</title>
  <link rel="stylesheet" href="../dashboard/dashboard.css">
  <link rel="stylesheet" href="sources.css">
  <script defer src="sources.js"></script>
</head>
<body>
  <main>
    <header>
      <div>
        <a href="../dashboard/">用量看板</a>
        <h1>来源管理</h1>
      </div>
      <button id="refresh-sources" type="button">刷新</button>
    </header>
    <p id="sources-notice" class="notice" role="status">正在读取来源…</p>

    <section id="sources-section" aria-labelledby="sources-heading">
      <h2 id="sources-heading">远程来源</h2>
      <p id="sources-empty" class="muted" hidden>尚未登记远程来源。</p>
      <div id="sources-table" class="table-scroll" role="region" tabindex="0" aria-label="远程来源列表" hidden>
        <table>
          <thead>
            <tr><th scope="col">来源</th><th scope="col">网关地址</th><th scope="col">状态</th><th scope="col">只读 Key</th><th scope="col">操作</th></tr>
          </thead>
          <tbody id="sources-rows"></tbody>
        </table>
      </div>
    </section>

    <section id="editor" aria-labelledby="source-title">
      <h2 id="source-title">添加来源</h2>
      <p class="muted">填写远程 Magpie 网关根地址和该实例的专用只读 Key。中心本机网关在插件设置中配置。</p>
      <form id="source-form">
        <fieldset id="source-fields" class="source-fields" disabled>
          <div class="source-field">
            <label for="source-name">来源名称</label>
            <input id="source-name" type="text" maxlength="80" autocomplete="off" required>
          </div>
          <div class="source-field">
            <label for="source-gateway">网关根地址</label>
            <input id="source-gateway" type="url" maxlength="512" placeholder="https://gateway.example.com" autocomplete="off" spellcheck="false" required>
          </div>
          <div class="source-field">
            <label for="source-key">专用只读 Key</label>
            <input id="source-key" type="password" maxlength="512" autocomplete="new-password" spellcheck="false" aria-describedby="source-key-hint" required>
            <small id="source-key-hint" class="muted">输入后先测试连接。</small>
          </div>
          <label class="source-check" for="source-enabled">
            <input id="source-enabled" type="checkbox" checked>
            启用查询
          </label>
          <div class="source-actions controls">
            <button id="test-source" type="button">测试连接</button>
            <button id="save-source" type="submit" disabled>保存来源</button>
            <button id="reset-source" type="button" hidden>清空草稿</button>
          </div>
        </fieldset>
      </form>
      <p id="source-notice" class="notice" role="status"></p>
      <div id="revision-review" hidden>
        <p id="latest-source" class="muted"></p>
        <button id="review-latest" type="button">载入最新修订并保留草稿</button>
      </div>
    </section>
  </main>
</body>
</html>
