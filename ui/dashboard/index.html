<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="usage-query-token" content="__USAGE_QUERY_TOKEN__">
  <title>用量看板 · Magpie Usage Hub</title>
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="dashboard.css">
  <script defer src="../options.js"></script>
  <script defer src="../host.js"></script>
  <script defer src="dashboard.js"></script>
</head>
<body>
  <main class="workspace dashboard" aria-label="用量看板">
    <div class="page-toolbar dashboard-toolbar" role="group" aria-label="看板工具栏">
      <div class="segmented" role="group" aria-label="视图">
        <button id="view-overview" type="button" aria-pressed="true">概览</button>
        <button id="view-details" type="button" aria-pressed="false">明细</button>
      </div>
      <div class="segmented" role="group" aria-label="统计周期">
        <button id="period-today" type="button" aria-pressed="false">今天</button>
        <button id="period-7d" type="button" aria-pressed="true">近 7 天</button>
        <button id="period-30d" type="button" aria-pressed="false">近 30 天</button>
        <button id="period-custom" type="button" aria-pressed="false" aria-expanded="false" aria-controls="custom-range">自定义</button>
      </div>
      <label class="inline-field" for="via">口径 <select id="via">
        <option value="through">网关</option><option value="conversation">会话</option><option value="all">全部分项</option>
      </select></label>
      <div class="dashboard-actions">
        <button id="refresh" type="button">刷新</button>
        <div id="billing" class="billing" hidden><span>已计价估算费用</span><strong id="billed"></strong><span id="unpriced" hidden></span></div>
        <a id="settings" class="quiet" href="../sources/">配置</a>
      </div>
    </div>
    <form id="custom-range" class="range-form panel" hidden>
      <label for="from">开始时间<input id="from" type="text" required maxlength="40" placeholder="2026-11-27T08:00:00+08:00" autocomplete="off" spellcheck="false" aria-describedby="range-hint"></label>
      <label for="to">结束时间<input id="to" type="text" required maxlength="40" placeholder="2026-11-27T09:00:00+08:00" autocomplete="off" spellcheck="false" aria-describedby="range-hint"></label>
      <button id="apply-range" class="primary" type="button">应用时间</button>
      <small id="range-hint" class="muted">使用带时区偏移或 Z 的时间。区间含开始、不含结束。</small>
      <span id="range-error" role="status"></span>
    </form>
    <div class="feedback"><span id="notice" role="status">正在读取用量…</span><button id="retry" type="button" hidden>重试</button><button id="reload" type="button" hidden>重新加载页面</button></div>
    <div id="loading" class="panel loading-stats" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <aside id="register-banner" class="register-banner" hidden>
      <strong>当前仅展示中心本机用量，尚未配置其他来源。</strong><a id="register" href="../sources/#add">配置来源</a>
    </aside>
    <div id="results" aria-busy="true" hidden>
      <div class="scope-bar">
        <label class="inline-field" for="source">来源 <select id="source"><option value="">全部来源</option></select></label>
        <label id="model-field" class="inline-field" for="model" hidden>模型 <select id="model"><option value="">全部模型</option></select></label>
        <div class="scope-time muted"><span id="range-label"></span><span>更新于 <time id="read-at"></time></span></div>
      </div>
      <div id="overview">
        <p id="usage-empty" class="usage-empty" hidden></p>
        <div class="panel kpis" role="group" aria-label="用量指标">
          <section class="kpi"><strong id="kpi-tokens">—</strong><h2>Token</h2><small id="token-note"></small></section>
          <section class="kpi"><strong id="kpi-cache">—</strong><h2>缓存读取</h2><small id="cache-note"></small></section>
          <section class="kpi"><strong id="kpi-reasoning">—</strong><h2>推理 Token</h2><small>已包含在输出 Token 中</small></section>
          <section class="kpi"><strong id="kpi-calls">—</strong><h2>计量次数</h2><small id="calls-note"></small></section>
        </div>
        <section class="panel trend-panel" aria-labelledby="trend-heading">
          <div class="toolbar panel-header"><div class="panel-title"><h2 id="trend-heading" class="section-heading">用量趋势</h2><small id="grain" class="muted" role="status"></small></div>
            <div class="trend-controls">
              <label class="inline-field" for="bucket">粒度 <select id="bucket"><option value="auto">自动</option><option value="hour">按小时</option><option value="day">按日</option></select></label>
              <div class="segmented" role="group" aria-label="用量指标"><button id="metric-tokens" type="button" aria-pressed="true">Token</button><button id="metric-calls" type="button" aria-pressed="false">次数</button><button id="metric-cost" type="button" aria-pressed="false">费用</button></div>
            </div>
          </div>
          <p id="trend-empty" class="empty" hidden></p>
          <div id="chart" hidden>
            <div class="plot-frame"><div id="y-axis" class="y-axis" aria-hidden="true"></div>
              <div id="plot" role="slider" tabindex="0" aria-label="用量趋势时段" aria-describedby="point-value chart-help" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1">
              <svg viewBox="0 0 1000 124" preserveAspectRatio="none" aria-hidden="true">
                <path class="grid-lines" d="M0 4H1000 M0 62H1000 M0 120H1000"/>
                <path id="trend-area"/><path id="trend-line" class="trend-line"/>
                <path id="point-guide" class="point-guide"/>
              </svg></div>
              <div id="x-axis" class="x-axis" aria-hidden="true"></div>
            </div>
            <div class="trend-inspection">
              <div><p id="point-time"></p><p id="point-value" class="point-value"></p></div>
              <button id="bucket-details" type="button">查看此时段明细</button>
            </div>
            <small id="chart-help" class="sr-only">使用左右方向键查看相邻时段，Home 和 End 跳至首末时段，按 Enter 查看明细。</small>
          </div>
        </section>
        <section class="list-section" aria-labelledby="sources-heading">
          <div class="toolbar list-heading"><h2 id="sources-heading" class="section-heading">来源分布</h2><small id="source-metric" class="muted"></small></div>
          <ul id="summary-rows" class="source-cards" role="list" aria-labelledby="sources-heading"></ul>
        </section>
        <section class="panel list-panel" aria-labelledby="models-heading">
          <div class="toolbar"><h2 id="models-heading" class="section-heading">模型排行</h2><small id="model-sort" class="muted"></small></div>
          <p id="models-empty" class="empty" hidden>所选范围内暂无模型用量。</p>
          <ul id="model-rows" class="usage-list" role="list" aria-labelledby="models-heading"></ul>
        </section>
      </div>
      <section id="rows-section" class="panel" aria-labelledby="rows-heading" hidden>
        <div class="toolbar panel-header"><h2 id="rows-heading" class="section-heading" tabindex="-1">用量明细</h2><button id="back-overview" class="quiet" type="button" hidden>返回趋势</button></div>
        <p id="detail-range" class="muted" hidden></p>
        <div class="feedback"><span id="rows-notice" role="status"></span><button id="rows-retry" type="button" hidden>重试明细</button><button id="rows-reload" type="button" hidden>重新加载页面</button></div>
        <div id="rows-table" class="table-scroll" role="region" tabindex="0" aria-label="用量明细表" hidden><table class="data-table">
          <thead><tr><th>调用时间</th><th>来源</th><th>模型</th><th>分项</th><th>输入 / 输出</th><th>缓存读 / 写</th><th>推理 Token</th><th>估算费用</th><th>HTTP 状态</th><th>用时</th></tr></thead>
          <tbody id="detail-rows"></tbody></table></div>
        <div id="row-pages" class="row-pages" aria-label="用量明细分页" hidden><button id="previous-rows" type="button">上一页</button><span id="current-page"></span><button id="next-rows" type="button">下一页</button></div>
      </section>
    </div>
  </main>
</body>
</html>
