<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>用量看板 · Magpie Usage Hub</title>
  <link rel="stylesheet" href="dashboard.css">
  <script defer src="dashboard.js"></script>
</head>
<body>
  <main>
    <header>
      <div>
        <nav class="controls" aria-label="中心页面">
          <a href="../sources/">来源管理</a>
          <a href="../">后台诊断</a>
        </nav>
        <h1>用量看板</h1>
      </div>
      <div class="controls">
        <label for="period">统计周期</label>
        <select id="period">
          <option value="today">今天</option>
          <option value="7d" selected>近 7 天</option>
          <option value="30d">近 30 天</option>
        </select>
        <button id="refresh" type="button">刷新</button>
      </div>
    </header>
    <p id="notice" class="notice" role="status">正在读取用量…</p>
    <section id="results" aria-labelledby="summary-heading" aria-busy="true" hidden>
      <h2 id="summary-heading">分来源汇总</h2>
      <p class="muted">周期按各来源的原生日历统计。</p>
      <div class="table-scroll" role="region" tabindex="0" aria-label="分来源用量汇总表">
        <table class="summary">
          <thead>
            <tr>
              <th scope="col">来源</th><th scope="col">统计起点</th><th scope="col">请求数</th>
              <th scope="col">输入 / 输出 Token</th><th scope="col">缓存读 / 写 Token</th>
              <th scope="col">已计价估算费用 (USD)</th><th scope="col">缺价记录</th><th scope="col">本次查询</th>
            </tr>
          </thead>
          <tbody id="summary-rows"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
