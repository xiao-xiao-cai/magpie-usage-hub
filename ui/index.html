<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>后台诊断 · Magpie Usage Hub</title>
  <link rel="stylesheet" href="status.css">
  <script defer src="status.js"></script>
</head>
<body>
  <main>
    <header>
      <div>
        <nav aria-label="中心页面">
          <a href="../../index.html">返回配置</a>
          <a id="dashboard-link" href="dashboard/" hidden>用量看板</a>
        </nav>
        <h1>后台诊断</h1>
      </div>
      <button id="refresh" type="button">刷新</button>
    </header>
    <p id="notice" role="status">正在读取后台状态…</p>
    <section id="status" aria-labelledby="runtime-heading" hidden>
      <h2 id="runtime-heading">中心查询服务</h2>
      <dl>
        <div><dt>状态</dt><dd id="phase"></dd></div>
        <div><dt>宿主读取的修订</dt><dd id="loaded-revision" class="revision"></dd></div>
        <div><dt>查询服务采用的修订</dt><dd id="applied-revision" class="revision"></dd></div>
      </dl>
      <p id="failure" class="failure" hidden></p>
    </section>
  </main>
</body>
</html>
