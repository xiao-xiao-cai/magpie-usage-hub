<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magpie Usage Hub</title>
  <link rel="stylesheet" href="configuration.css">
  <script defer src="_magpie/bridge.js"></script>
  <script defer src="options.js"></script>
  <script defer src="configuration.js"></script>
</head>
<body>
  <main class="layout">
    <header class="page-header">
      <div>
        <h1>用量汇总</h1>
        <p class="muted" id="diagnostic-guide">在 Magpie Web 的插件页打开运行诊断。</p>
      </div>
      <a id="diagnostic-link" class="action-link" hidden>打开运行诊断</a>
    </header>

    <section class="panel" aria-labelledby="settings-title">
      <header class="section-header">
        <h2 id="settings-title">部署配置</h2>
        <button id="reload-options" type="button">重新读取</button>
      </header>
      <form id="settings-form" novalidate>
        <fieldset id="settings-fields" disabled aria-labelledby="settings-title">
          <label class="check-row" for="enabled">
            <input id="enabled" type="checkbox">
            启用当前角色
          </label>
          <div class="fields">
            <div class="field">
              <label for="role">部署角色</label>
              <select id="role">
                <option value="source">来源：采集并上报</option>
                <option value="center">中心：接收并汇总</option>
              </select>
            </div>
            <div class="field">
              <label for="requestTimeoutSec">单次请求超时（秒）</label>
              <input id="requestTimeoutSec" type="number" min="1" max="120" step="1" value="30">
            </div>
          </div>
          <fieldset id="source-settings" aria-label="来源设置">
            <div class="fields">
              <div class="field">
                <label for="mode">来源接入方式</label>
                <select id="mode">
                  <option value="managed">中心管理（一次配对）</option>
                  <option value="continuous">手工配置</option>
                </select>
              </div>
              <div class="field">
                <label for="sourceGatewayUrl">本机源网关</label>
                <input id="sourceGatewayUrl" type="url" placeholder="http://127.0.0.1:3425" autocomplete="off" spellcheck="false">
              </div>
              <div class="field">
                <label for="centralGatewayUrl">中心接收地址</label>
                <input id="centralGatewayUrl" type="url" placeholder="https://usage.example.com" autocomplete="off" spellcheck="false">
              </div>
            </div>
            <fieldset id="managed-settings" aria-label="中心配对" class="fields">
              <div class="field">
                <label for="pairingCodeFile">一次性配对码文件路径 <span id="pairing-code-state" class="muted"></span></label>
                <input id="pairingCodeFile" type="password" autocomplete="new-password" spellcheck="false" aria-describedby="pairing-code-hint">
                <small id="pairing-code-hint">在中心的「来源管理」生成配对码，写入仅宿主账户可读的文本文件。首次配对填文件的绝对路径。</small>
              </div>
            </fieldset>
            <fieldset id="manual-settings" aria-label="手工采集设置" class="fields" hidden disabled>
              <div class="field">
                <label for="sourceCallerKeyId">专用测试 Key ID</label>
                <input id="sourceCallerKeyId" type="text" autocomplete="off" spellcheck="false">
              </div>
              <div class="field">
                <label for="sourceProviderId">供应商 ID</label>
                <input id="sourceProviderId" type="text" autocomplete="off" spellcheck="false" aria-describedby="provider-hint">
                <small id="provider-hint">填写用量账本的供应商 ID。只上报同时匹配此供应商和专用 Key 的调用。</small>
              </div>
              <div class="field">
                <label for="centralKeyFile">上报凭据文件路径 <span id="key-state" class="muted"></span></label>
                <input id="centralKeyFile" type="password" autocomplete="new-password" spellcheck="false" aria-describedby="key-file-hint">
                <small id="key-file-hint">填写宿主上的绝对路径。留空沿用已配置的文件。</small>
              </div>
              <div class="field">
                <label for="initialMode">首次起点</label>
                <select id="initialMode">
                  <option value="now">从现在开始</option>
                  <option value="start">读取可见历史</option>
                </select>
              </div>
              <div class="field">
                <label for="pollIntervalSec">轮询间隔（秒）</label>
                <input id="pollIntervalSec" type="number" min="5" max="900" step="1" value="60">
              </div>
            </fieldset>
          </fieldset>
          <fieldset id="center-settings" aria-label="中心设置" hidden disabled>
            <div class="fields">
              <div class="field">
                <label for="centerGatewayUrl">本机中心网关</label>
                <input id="centerGatewayUrl" type="url" placeholder="http://127.0.0.1:3425" autocomplete="off" spellcheck="false">
              </div>
              <div class="field">
                <label for="ingestHost">接收监听地址</label>
                <select id="ingestHost" aria-describedby="ingest-host-hint">
                  <option value="127.0.0.1">本机回环（127.0.0.1）</option>
                  <option value="0.0.0.0">容器接口（0.0.0.0）</option>
                </select>
                <small id="ingest-host-hint">容器部署时，将接收端口只发布到已授权的专用网络。</small>
              </div>
              <div class="field">
                <label for="ingestPort">接收端口</label>
                <input id="ingestPort" type="number" min="1" max="65535" step="1" value="3494">
              </div>
              <div class="field">
                <label for="ingestKeyFile">接收凭据文件路径 <span id="ingest-key-state" class="muted"></span></label>
                <input id="ingestKeyFile" type="password" autocomplete="new-password" spellcheck="false" aria-describedby="ingest-key-hint">
                <small id="ingest-key-hint">手工上报凭据可填写中心宿主上的绝对路径。留空沿用已配置的文件。</small>
              </div>
            </div>
          </fieldset>
          <div class="actions">
            <button type="submit" class="primary" id="save-settings">保存设置</button>
            <button id="rebase-options" type="button" hidden>载入最新设置并保留草稿</button>
          </div>
        </fieldset>
      </form>
      <p id="settings-message" class="feedback" role="status" aria-live="polite">正在读取设置…</p>
      <ul id="options-difference" class="difference" hidden></ul>
      <p id="settings-revision" class="revision" hidden>保存修订 <code id="revision-value"></code></p>
    </section>

    <section class="panel" id="recovery-panel" aria-labelledby="recovery-title">
      <h2 id="recovery-title">向原中心回填</h2>
      <p class="muted">可补传源账本仍可见的记录。区间包含起点，截止时刻不计入。</p>
      <form id="recovery-form" novalidate>
        <fieldset id="recovery-fields" disabled aria-labelledby="recovery-title">
          <div class="fields recovery-fields">
            <div class="field">
              <label for="recovery-kind">回填方式</label>
              <select id="recovery-kind">
                <option value="range">补齐指定时间段</option>
                <option value="cursor">恢复已过期或重置的游标</option>
              </select>
            </div>
            <div class="field">
              <label for="recovery-from">起点（本地时间）</label>
              <input id="recovery-from" type="datetime-local" step="1" required>
            </div>
            <div class="field" id="recovery-end-field">
              <label for="recovery-to">截止（本地时间）</label>
              <input id="recovery-to" type="datetime-local" step="1">
            </div>
          </div>
          <div class="actions">
            <button type="submit" class="primary" id="review-recovery">核对回填范围</button>
          </div>
        </fieldset>
      </form>
      <p id="recovery-hint" class="feedback">请先读取同步设置。</p>
      <p id="recovery-message" class="feedback" role="status" aria-live="polite"></p>
      <div id="submitted-request" class="request" hidden>
        <p id="submitted-request-text"></p>
        <button id="withdraw-request" type="button">撤回待受理请求</button>
      </div>
    </section>
  </main>

  <dialog id="confirmation" aria-labelledby="confirmation-title" aria-describedby="confirmation-note">
    <h2 id="confirmation-title"></h2>
    <dl class="review" id="confirmation-fields" hidden></dl>
    <p class="muted" id="confirmation-note"></p>
    <div class="actions">
      <button id="confirm-action" class="primary" type="button"></button>
      <button id="cancel-action" type="button" autofocus>取消</button>
    </div>
  </dialog>
</body>
</html>
