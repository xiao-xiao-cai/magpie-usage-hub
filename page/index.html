<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magpie Usage Hub</title>
  <link rel="stylesheet" href="configuration.css">
  <script defer src="_magpie/bridge.js"></script>
  <script defer src="options.js"></script>
  <script defer src="configuration.js"></script>
</head>
<body>
  <main class="layout">
    <header class="page-header">
      <div>
        <h1>用量汇总</h1>
        <p class="muted" id="diagnostic-guide">在 Magpie Web 的插件页打开用量看板。</p>
      </div>
      <a id="diagnostic-link" class="action-link" hidden>打开用量看板</a>
    </header>

    <section class="panel" aria-labelledby="settings-title">
      <header class="section-header">
        <h2 id="settings-title">中心设置</h2>
        <button id="reload-options" type="button">重新读取</button>
      </header>
      <p id="migration-guide" class="feedback" hidden>检测到旧版启用配置。请在中心启用只读查询并保存，再到用量看板的「来源管理」登记远程来源。</p>
      <form id="settings-form" novalidate>
        <fieldset id="settings-fields" disabled aria-labelledby="settings-title">
          <label class="check-row" for="enabled">
            <input id="enabled" type="checkbox">
            启用中心只读查询
          </label>
          <div class="fields">
            <div class="field">
              <label for="centerGatewayUrl">中心本机网关</label>
              <input id="centerGatewayUrl" type="url" placeholder="http://127.0.0.1:3425" autocomplete="off" spellcheck="false" aria-describedby="gateway-hint">
              <small id="gateway-hint">填写中心宿主内的回环网关根地址。</small>
            </div>
            <div class="field">
              <label for="requestTimeoutSec">单次请求超时（秒）</label>
              <input id="requestTimeoutSec" type="number" min="1" max="120" step="1" value="30" required>
            </div>
          </div>
          <div class="actions">
            <button type="submit" class="primary" id="save-settings">保存设置</button>
            <button id="rebase-options" type="button" hidden>载入最新设置并保留草稿</button>
          </div>
        </fieldset>
      </form>
      <p id="settings-message" class="feedback" role="status">正在读取设置…</p>
      <ul id="options-difference" class="difference" hidden></ul>
      <p id="settings-revision" class="revision" hidden>保存修订 <code id="revision-value"></code></p>
    </section>
  </main>
</body>
</html>
